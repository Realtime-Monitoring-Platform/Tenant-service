syntax = "proto3";


package tenant;


option java_multiple_files = true;

option java_package =
"com.realtime_monitoring.tenant_managment.grpc";



service TenantService {


  rpc getTenantsByIds(
      GetTenantsRequest
  )
  returns(
      GetTenantsResponse
  );


}



message GetTenantsRequest {

 repeated string tenant_ids = 1;

}



message GetTenantsResponse {

 repeated Tenant tenants = 1;

}



message Tenant {

 string id = 1;

 string name = 2;

 string status = 3;

}